name: Tests

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"   # wekelijks: draait ook de live-AH-tests om API-wijzigingen vroeg te zien
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest
      - name: Offline tests (koppelen, weekmenu, API)
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: python -m pytest -q -m "not live"
      - name: Live AH-tests (alleen wekelijks/handmatig; mag falen zonder de build te breken)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          DATABASE_URL: sqlite:///./ci.db
          LIVE_AH: "1"
        run: python -m pytest -q -m live
