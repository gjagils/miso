<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}Miso{% endblock %}</title>
    <link rel="manifest" href="/static/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/static/icons/icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Miso">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#FF8A00" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0A1F35" media="(prefers-color-scheme: dark)">
    <meta name="description" content="Miso: altijd iets lekkers op de planning.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v=5">
</head>
<body>
    <nav class="topbar">
        <a href="/" class="logo" aria-label="Miso, naar Vandaag"><img src="/static/miso/miso-classic.webp" alt="" width="40" height="40"><span>Mis<span class="o">o</span></span></a>
        <span class="tagline">Altijd iets lekkers op de planning.</span>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
    <div class="tabbar">
        <a href="/"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>Vandaag</a>
        <a href="/recepten"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M9 9h6M9 13h6"/></svg>Recepten</a>
        <a href="/kiezen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v18M4.5 3v5a2.5 2.5 0 0 0 5 0V3M17.5 21V3c-2.2 1.2-3.5 4-3.5 7.5V13h3.5"/></svg>Kiezen</a>
        <a href="/weekmenu"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Weekmenu</a>
        <a href="/settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="18" cy="12" r="1.2"/></svg>Meer</a>
    </div>
    <script>
        document.querySelectorAll(".tabbar a").forEach(a => {
            const p = location.pathname;
            if (a.getAttribute("href") === "/" ? p === "/" : p.startsWith(a.getAttribute("href"))) a.classList.add("active");
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
