services:
  miso:
    build: ./backend
    container_name: Miso
    # Docker-netwerkpool op de NAS is vol: gebruik het standaard bridge-netwerk
    network_mode: bridge
    ports:
      - 9927:8000
    environment:
      TZ: Europe/Amsterdam
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      APP_PIN: ${APP_PIN:-}
      MISO_SECRET: ${MISO_SECRET:-}  # versleutelt AH-/Mealie-tokens in de database
    volumes:
      - ${DATA_DIR:-./data}:/app/data
    restart: on-failure:5

  # Eenmalige AH-inlogproxy: open http://<nas>:9928/start om je AH-account te koppelen
  miso-login:
    build: ./backend
    container_name: Miso-login
    network_mode: bridge
    command: ["uvicorn", "app.ah_login_proxy:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - 9928:8001
    environment:
      TZ: Europe/Amsterdam
      APP_PIN: ${APP_PIN:-}
      MISO_SECRET: ${MISO_SECRET:-}
    volumes:
      - ${DATA_DIR:-./data}:/app/data
    restart: on-failure:5
