name: AHRecepten
options:
  bundleIdPrefix: nl.gerdjan
  deploymentTarget:
    iOS: "17.0"
targets:
  AHRecepten:
    type: application
    platform: iOS
    sources: [AHRecepten]
    info:
      path: AHRecepten/Info.plist
      properties:
        CFBundleDisplayName: Miso
        UILaunchScreen:
          UIColorName: MisoCream
          UIImageName: LaunchMascot
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Toestaan dat de server op het thuisnetwerk via http bereikbaar is (bijv. http://synology.local:9927)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.gerdjan.ahrecepten
        DEVELOPMENT_TEAM: 65FAHRU88M
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
